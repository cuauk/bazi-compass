name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Create missing platform folders
        run: flutter create --project-name bazi_compass .
        
      - name: Install dependencies
        run: flutter pub get
        
      # 这次把 minSdkVersion 也加上了
      - name: Fix Android SDK Versions
        run: |
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 34/g' android/app/build.gradle
          
      - name: Build APK
        run: flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: bazi-compass-apk
          path: build/app/outputs/flutter-apk/app-release.apk
